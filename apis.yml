name: Pick1
description: Pick1 was a real-time survey and social analytics platform founded in 2010 in San Francisco
  by Paolo Privitera (with Armando Biondi and Lorenzo Barbantini Scanni). It let brands run white-label
  surveys and augment respondent profiles with data from a dozen-plus social networks for audience
  segmentation, CRM enrichment, and retargeting, working with brands such as IKEA, Toyota, Telefonica,
  and American Express. The company was seed-backed by 500 Global and others, and was acquired by Evensi
  around 2017; its operating status is now closed and the pick1.com domain no longer resolves. This
  record is retained as a historical portfolio-lead stub — there is no live API or developer surface to
  enrich.
